[project]
name = "screen-assistant"
version = "0.3.0"
description = "Desktop assistant for viewing content"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8", "pillow"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
screen-assistant = "screen_assistant.__main__:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["screen_assistant*"]

[[tool.uv.index]]
name = "index"
url = "https://pypi.org/simple/"

[tool.pytest.ini_options]
testpaths = ["screen_assistant/test_verification.py"]
addopts = "-ra"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
